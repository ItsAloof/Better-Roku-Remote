<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Roku</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
/* A pretend Roku TV for testing the remote. Pick "Virtual Roku" in the remote's device list. */
:root{color-scheme:dark;--bg:#0b0613;--panel:#170d27;--text:#f4f0fb;--muted:#a69cbd;--accent:#8a5cff;--focus:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#tv{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:var(--bg);overflow:hidden;container-type:inline-size;border-radius:6px;
  box-shadow:0 0 0 1px #222,0 20px 80px rgba(120,80,255,.15)}
.screen{position:absolute;inset:0;padding:3.2cqw 4cqw;display:flex;flex-direction:column;gap:2.2cqw}
.top{display:flex;justify-content:space-between;align-items:center;font-size:1.7cqw;color:var(--muted)}
.top b{color:var(--text);font-size:2.2cqw;letter-spacing:.02em}
h1{margin:0;font-size:3.2cqw}
/* home grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw}
.tile{aspect-ratio:290/218;border-radius:1cqw;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.9cqw;text-align:center;padding:1cqw;
  transition:transform .12s,box-shadow .12s;outline:.35cqw solid transparent;outline-offset:.3cqw}
.tile.focus,.card.focus{outline-color:var(--focus);transform:scale(1.05);box-shadow:0 1cqw 3cqw rgba(0,0,0,.5)}
/* app page */
.hero{flex:1;border-radius:1.2cqw;padding:3cqw;display:flex;flex-direction:column;justify-content:flex-end;gap:.8cqw}
.hero h2{margin:0;font-size:3.6cqw}
.hero p{margin:0;color:rgba(255,255,255,.8);font-size:1.6cqw;max-width:60%}
.row{display:flex;gap:1.4cqw}
.card{flex:1;max-width:18cqw;aspect-ratio:16/10;border-radius:.9cqw;display:flex;align-items:flex-end;padding:1cqw;font-weight:600;font-size:1.4cqw;
  transition:transform .12s,box-shadow .12s;outline:.3cqw solid transparent;outline-offset:.25cqw}
/* player */
.player{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:4cqw}
.player .art{position:absolute;inset:0;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{filter:hue-rotate(40deg) brightness(1.15)}}
.player.paused .art{animation-play-state:paused;filter:brightness(.6)}
.osd{position:relative;display:flex;flex-direction:column;gap:1cqw;transition:opacity .3s}
.osd.hide{opacity:0}
.osd h2{margin:0;font-size:3cqw;text-shadow:0 .3cqw 1.5cqw rgba(0,0,0,.6)}
.bar{height:.6cqw;border-radius:.3cqw;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:1.4cqw;color:rgba(255,255,255,.85)}
.pausebig{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:8cqw;opacity:.9;text-shadow:0 0 3cqw rgba(0,0,0,.6)}
/* search */
.searchbox{font-size:2.6cqw;padding:1.4cqw 2cqw;border-radius:1cqw;background:var(--panel);border:.2cqw solid #3a2a5a;min-height:5.5cqw}
.caret{display:inline-block;width:.25cqw;height:2.8cqw;background:var(--text);vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.muted{color:var(--muted)}
/* overlays */
#key{position:absolute;right:2cqw;top:2cqw;background:rgba(0,0,0,.65);padding:.8cqw 1.4cqw;border-radius:.8cqw;font-size:1.5cqw;opacity:0;transition:opacity .4s;pointer-events:none}
#key.show{opacity:1;transition:none}
#vol{position:absolute;right:3cqw;top:50%;transform:translateY(-50%);width:3cqw;height:30%;background:rgba(0,0,0,.6);border-radius:1.5cqw;padding:.6cqw;opacity:0;transition:opacity .4s;display:flex;flex-direction:column;justify-content:flex-end}
#vol.show{opacity:1;transition:none}
#vol i{display:block;border-radius:1cqw;background:#fff}
#vol span{position:absolute;top:-3cqw;left:50%;transform:translateX(-50%);font-size:1.4cqw;white-space:nowrap}
#toast{position:absolute;left:50%;top:3cqw;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:1cqw 2cqw;border-radius:1cqw;font-size:1.6cqw;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#off{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;color:#333;font-size:1.6cqw}
#off.on{display:flex}
#status{position:fixed;left:12px;bottom:10px;font:12px/1.3 -apple-system,system-ui,sans-serif;color:#888}
#status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#666;margin-right:6px}
#status.ok i{background:#3ecf8e}
</style>
</head>
<body>
<div id="tv">
  <div id="screen"></div>
  <div id="vol"><span></span><i></i></div>
  <div id="toast"></div>
  <div id="key"></div>
  <div id="off">Standby — press Power</div>
</div>
<div id="status"><i></i><span>Connecting…</span></div>

<script>
const $ = s => document.querySelector(s);
const SHOWS = ['Ocean Trails', 'Night Signal', 'The Long Drive', 'Comet Kitchen', 'Lost Frequencies', 'Paper Moons',
               'Glass Harbor', 'Midnight Garden', 'Static Hearts', 'North of Nowhere', 'The Quiet Engine', 'Saltwater'];
const BLURBS = ['A slow-burn mystery on a windswept coast.', 'Two strangers, one radio, and a signal nobody can explain.',
                'A road trip that keeps getting longer.', 'Chefs cook with whatever the comet leaves behind.'];
const grad = (i, k = 0) => {
  const h = (i * 47 + k * 90) % 360;
  return `linear-gradient(135deg, hsl(${h} 70% 35%), hsl(${(h + 60) % 360} 75% 18%))`;
};
const fmt = ms => { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = String(t % 60).padStart(2, '0');
                    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`; };

let apps = [];
const tv = { screen: 'home', focus: 0, app: null, shows: [], showFocus: 0, show: null, pos: 0, dur: 0,
             playing: false, osdUntil: 0, query: '', volume: 30, muted: false, power: true };

/* ---------- rendering ---------- */
function clock(){ return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function render(){
  const el = $('#screen');
  if(tv.screen === 'home'){
    el.innerHTML = `<div class="screen"><div class="top"><b>Home</b><span>${clock()}</span></div>
      <h1>Your apps</h1><div class="grid">${apps.map((a, i) =>
        `<div class="tile ${i === tv.focus ? 'focus' : ''}" style="background:${a.bg};color:${a.fg}">${a.name}</div>`).join('')}</div></div>`;
  } else if(tv.screen === 'app'){
    const a = tv.app, s = tv.shows[tv.showFocus];
    el.innerHTML = `<div class="screen"><div class="top"><b style="color:${a.bg === '#1b1b1b' ? '#fff' : a.bg}">${a.name}</b><span>${clock()}</span></div>
      <div class="hero" style="background:${grad(tv.showFocus, a.name.length)}"><h2>${s.title}</h2><p>${s.blurb}</p></div>
      <div class="row">${tv.shows.map((x, i) =>
        `<div class="card ${i === tv.showFocus ? 'focus' : ''}" style="background:${grad(i, a.name.length)}">${x.title}</div>`).join('')}</div></div>`;
  } else if(tv.screen === 'player'){
    const pct = tv.dur ? tv.pos / tv.dur * 100 : 0, osd = !tv.playing || Date.now() < tv.osdUntil;
    el.innerHTML = `<div class="player ${tv.playing ? '' : 'paused'}"><div class="art" style="background:${grad(SHOWS.indexOf(tv.show.title), tv.app.name.length)}"></div>
      ${tv.playing ? '' : '<div class="pausebig">❚❚</div>'}
      <div class="osd ${osd ? '' : 'hide'}"><div class="muted" style="font-size:1.5cqw">${tv.app.name}</div><h2>${tv.show.title}</h2>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="times"><span>${fmt(tv.pos)}</span><span>${fmt(tv.dur)}</span></div></div></div>`;
  } else if(tv.screen === 'search'){
    const q = tv.query.trim().toLowerCase();
    const hits = q ? SHOWS.filter(t => t.toLowerCase().includes(q)) : [];
    el.innerHTML = `<div class="screen"><div class="top"><b>Search</b><span>${clock()}</span></div>
      <div class="searchbox">${escapeHtml(tv.query)}<span class="caret"></span></div>
      <div class="muted" style="font-size:1.6cqw">${q ? (hits.length ? `Results for “${escapeHtml(tv.query)}”` : `No matches for “${escapeHtml(tv.query)}” — try “night” or “ocean”`) : 'Type with the remote’s Keyboard'}</div>
      <div class="row">${hits.slice(0, 5).map((t, i) => `<div class="card ${i === tv.showFocus ? 'focus' : ''}" style="background:${grad(SHOWS.indexOf(t))}">${t}</div>`).join('')}</div></div>`;
  }
  $('#off').classList.toggle('on', !tv.power);
  report();
}
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let toastT, keyT, volT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
const KEYNAMES = { Up: '▲ Up', Down: '▼ Down', Left: '◀ Left', Right: '▶ Right', Select: '● OK', Back: '↩ Back', Home: '⌂ Home', Info: '✱ Options',
                   Play: '▶❚❚ Play/Pause', Rev: '◀◀ Rewind', Fwd: '▶▶ Fast forward', InstantReplay: '↺ Replay', VolumeUp: 'Vol +', VolumeDown: 'Vol −',
                   VolumeMute: 'Mute', Power: '⏻ Power', PowerOn: '⏻ On', PowerOff: '⏻ Off', Search: '🔍 Search', Backspace: '⌫', Enter: '⏎ Enter' };
function showKey(label){ const k = $('#key'); k.textContent = label; k.classList.add('show'); clearTimeout(keyT); keyT = setTimeout(() => k.classList.remove('show'), 900); }
function showVol(){
  const v = $('#vol'); v.querySelector('i').style.height = (tv.muted ? 0 : tv.volume) + '%';
  v.querySelector('span').textContent = tv.muted ? 'Muted' : tv.volume;
  v.classList.add('show'); clearTimeout(volT); volT = setTimeout(() => v.classList.remove('show'), 1400);
}

/* ---------- actions ---------- */
function openApp(app){
  if(!app) return;
  const seed = Number(app.id.slice(-2)) || 3;
  tv.app = app; tv.screen = 'app'; tv.showFocus = 0;
  tv.shows = Array.from({ length: 6 }, (_, i) => ({ title: SHOWS[(seed + i * 5) % SHOWS.length], blurb: BLURBS[(seed + i) % BLURBS.length] }));
  render();
}
function play(title){
  tv.show = { title }; tv.screen = 'player'; tv.pos = 0; tv.dur = (22 + (title.length * 7) % 40) * 60000;
  tv.playing = true; tv.osdUntil = Date.now() + 3000; render();
}
function goHome(){ tv.screen = 'home'; tv.app = null; tv.playing = false; render(); }

function onKey(key){
  showKey(KEYNAMES[key] || key);
  if(key === 'Power' || key === 'PowerOff' || key === 'PowerOn'){
    tv.power = key === 'PowerOn' ? true : key === 'PowerOff' ? false : !tv.power;
    if(!tv.power) tv.playing = false;
    return render();
  }
  if(!tv.power) return;
  if(key === 'VolumeUp'){ tv.muted = false; tv.volume = Math.min(100, tv.volume + 2); return showVol(); }
  if(key === 'VolumeDown'){ tv.muted = false; tv.volume = Math.max(0, tv.volume - 2); return showVol(); }
  if(key === 'VolumeMute'){ tv.muted = !tv.muted; return showVol(); }
  if(key === 'Home') return goHome();
  if(key === 'Search'){ tv.screen = 'search'; tv.query = ''; tv.showFocus = 0; return render(); }
  if(key === 'Info') return toast('Options');

  if(tv.screen === 'home'){
    const n = apps.length, c = 4;
    if(key === 'Left') tv.focus = Math.max(0, tv.focus - 1);
    if(key === 'Right') tv.focus = Math.min(n - 1, tv.focus + 1);
    if(key === 'Up') tv.focus = Math.max(0, tv.focus - c);
    if(key === 'Down') tv.focus = Math.min(n - 1, tv.focus + c);
    if(key === 'Select') return openApp(apps[tv.focus]);
  } else if(tv.screen === 'app'){
    if(key === 'Left') tv.showFocus = Math.max(0, tv.showFocus - 1);
    if(key === 'Right') tv.showFocus = Math.min(tv.shows.length - 1, tv.showFocus + 1);
    if(key === 'Back') return goHome();
    if(key === 'Select' || key === 'Play') return play(tv.shows[tv.showFocus].title);
  } else if(tv.screen === 'player'){
    tv.osdUntil = Date.now() + 3000;
    if(key === 'Play' || key === 'Select') tv.playing = !tv.playing;
    if(key === 'Fwd' || key === 'Right') tv.pos = Math.min(tv.dur, tv.pos + 30000);
    if(key === 'Rev' || key === 'Left') tv.pos = Math.max(0, tv.pos - 30000);
    if(key === 'InstantReplay') tv.pos = Math.max(0, tv.pos - 10000);
    if(key === 'Back'){ tv.playing = false; tv.screen = 'app'; }
  } else if(tv.screen === 'search'){
    const q = tv.query.trim().toLowerCase(), hits = q ? SHOWS.filter(t => t.toLowerCase().includes(q)) : [];
    if(key === 'Backspace') tv.query = tv.query.slice(0, -1);
    if(key === 'Left') tv.showFocus = Math.max(0, tv.showFocus - 1);
    if(key === 'Right') tv.showFocus = Math.min(Math.max(0, Math.min(hits.length, 5) - 1), tv.showFocus + 1);
    if(key === 'Back') return goHome();
    if((key === 'Select' || key === 'Enter') && hits.length){ tv.app = apps[0]; return play(hits[Math.min(tv.showFocus, hits.length - 1)]); }
  }
  render();
}
let okDownAt = 0;
function onEvent(ev){
  if(ev.type === 'key' && ev.action === 'up'){
    if(ev.key === 'Select' && okDownAt && tv.power){
      const ms = Date.now() - okDownAt;
      if(ms >= 600){ showKey(`● OK held ${(ms / 1000).toFixed(1)}s`); toast('Long press: options menu'); }
    }
    okDownAt = 0; return;
  }
  if(ev.type === 'key'){ if(ev.action === 'down' && ev.key === 'Select') okDownAt = Date.now(); return onKey(ev.key); }
  if(!tv.power) return;
  if(ev.type === 'launch'){ showKey('Launch app'); const a = apps.find(x => x.id === ev.id); if(a){ toast(`Opening ${a.name}`); openApp(a); } return; }
  if(ev.type === 'search'){ showKey('Search'); tv.screen = 'search'; tv.query = ev.q || ''; tv.showFocus = 0; return render(); }
  if(ev.type === 'text'){
    showKey(`“${ev.text}”`);
    if(tv.screen !== 'search'){ tv.screen = 'search'; tv.query = ''; tv.showFocus = 0; }
    tv.query += ev.text; return render();
  }
}

/* ---------- playback clock & reporting to the remote's Now Playing ---------- */
setInterval(() => {
  if(tv.screen === 'player' && tv.playing && tv.power){
    tv.pos = Math.min(tv.dur, tv.pos + 250);
    if(tv.pos >= tv.dur) tv.playing = false;
  }
  if(tv.screen === 'player') render();
}, 250);
setInterval(() => { if(tv.screen === 'home' || tv.screen === 'app' || tv.screen === 'search') render(); }, 30000);  // keep the clock fresh

let lastReport = '', lastReportAt = 0;
function report(){
  const inApp = tv.power && tv.app && (tv.screen === 'app' || tv.screen === 'player');
  const body = {
    app: inApp ? { id: tv.app.id, name: tv.app.name } : null,
    player: inApp && tv.screen === 'player' ? { state: tv.playing ? 'play' : 'pause', position: Math.round(tv.pos), duration: tv.dur, live: false } : null,
  };
  const sig = JSON.stringify({ ...body, player: body.player && { ...body.player, position: 0 } });
  if(sig === lastReport && Date.now() - lastReportAt < 2000) return;   // position updates every 2s is plenty
  lastReport = sig; lastReportAt = Date.now();
  fetch('/api/virtual/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
}

/* ---------- wait for presses from the remote (long-poll) ---------- */
let seq = -1;
async function listen(){
  for(;;){
    try{
      const r = await fetch('/api/virtual/events?after=' + seq);
      const d = await r.json();
      if(!apps.length && d.apps){ apps = d.apps; render(); }
      if(seq > d.seq) seq = d.seq;                // server restarted
      d.events.forEach(onEvent);
      seq = d.seq;
      $('#status').className = 'ok';
      $('#status span').textContent = 'Virtual Roku ready. On your phone, tap the Roku name and pick “Virtual Roku”.';
    }catch(e){
      $('#status').className = '';
      $('#status span').textContent = 'Can’t reach the remote server. Retrying…';
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}
render();
listen();
</script>
</body>
</html>
